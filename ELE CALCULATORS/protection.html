<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#050810" />
<title>Protection · Electrical.Calc</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#eef4ff;--ink-soft:rgba(238,244,255,.78);--ink-dim:rgba(238,244,255,.55);--glass:rgba(255,255,255,.06);--glass-strong:rgba(255,255,255,.10);--glass-hover:rgba(255,255,255,.14);--glass-border:rgba(255,255,255,.16);--glass-border-strong:rgba(255,255,255,.28);--blue:#4f9dff;--blue-glow:rgba(79,157,255,.55);--cyan:#22d3ee;--sky:#7dd3fc;--lime:#a3e635;--rose:#fb7185;--amber:#fbbf24;--bg-base:#040a18;--radius:26px;--font:'Inter',system-ui,-apple-system,sans-serif;--shadow-glass:0 8px 32px rgba(0,0,0,.25),0 1px 0 rgba(255,255,255,.10) inset,0 0 0 1px rgba(255,255,255,.04) inset;--shadow-hover:0 16px 48px rgba(79,157,255,.35),0 1px 0 rgba(255,255,255,.15) inset}
html,body{height:100%;width:100%}
body{background-color:var(--bg-base);color:var(--ink);font-family:var(--font);min-height:100vh;overflow-x:hidden}
.bg-photo-desktop,.bg-photo-mobile{position:fixed;inset:0;background-size:cover;background-position:center;background-repeat:no-repeat;background-color:#040a18;pointer-events:none;z-index:-3}
.bg-photo-desktop{background-image:url("bgfordesktop.jpg");display:block}
.bg-photo-mobile{background-image:url("bgformobile.jpg");display:none}
@media (max-width:767px){.bg-photo-desktop{display:none}.bg-photo-mobile{display:block}}
.bg-layer{position:fixed;inset:0;z-index:-2;pointer-events:none;background:linear-gradient(180deg,rgba(0,10,30,.35) 0%,rgba(0,10,30,0) 18%,rgba(0,10,30,0) 82%,rgba(0,10,30,.4) 100%)}
body.loaded{animation:pageIn .5s ease both}@keyframes pageIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
body.leaving{animation:pageOut .35s ease forwards}@keyframes pageOut{to{opacity:0;transform:translateY(-14px)}}
.wrap{max-width:1100px;margin:0 auto;padding:24px 18px 80px;position:relative;z-index:1}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.back{display:inline-flex;align-items:center;gap:10px;padding:12px 18px;font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.1em;text-decoration:none;color:#fff;background:var(--glass);border:1px solid var(--glass-border);border-radius:999px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:var(--shadow-glass);transition:.2s}
.back:hover{background:var(--glass-hover);border-color:var(--glass-border-strong);transform:translateY(-1px)}
.pdf-btn{display:inline-flex;align-items:center;gap:10px;padding:12px 20px;font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.1em;cursor:pointer;color:#fff;font-family:var(--font);background:linear-gradient(135deg,rgba(79,157,255,.55),rgba(34,211,238,.3));border:1px solid rgba(79,157,255,.55);border-radius:999px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 12px 40px rgba(79,157,255,.4),inset 0 1px 0 rgba(255,255,255,.2);transition:.2s}
.pdf-btn:hover{transform:translateY(-2px);box-shadow:0 18px 55px rgba(79,157,255,.55),inset 0 1px 0 rgba(255,255,255,.3)}
.card{background:var(--glass);border:1px solid var(--glass-border);border-radius:var(--radius);backdrop-filter:blur(28px) saturate(1.6);-webkit-backdrop-filter:blur(28px) saturate(1.6);box-shadow:var(--shadow-glass);padding:26px;animation:cardIn .5s ease both}
@keyframes cardIn{from{opacity:0;transform:translateY(20px) scale(.98)}to{opacity:1;transform:none}}
.head{margin-bottom:26px;padding-bottom:18px;border-bottom:1px solid var(--glass-border)}
.head h1{font-size:clamp(26px,5vw,42px);font-weight:900;text-transform:uppercase;letter-spacing:-.02em;line-height:1;color:#fff}
.head h1 em{font-style:normal;background:linear-gradient(135deg,rgba(79,157,255,.42),rgba(34,211,238,.22));border:1px solid rgba(79,157,255,.5);border-radius:14px;padding:4px 16px;color:#fff;display:inline-block;margin:4px 4px 4px 0;box-shadow:0 8px 32px rgba(79,157,255,.35)}
.head p{margin-top:12px;font-size:13px;font-weight:600;color:var(--ink-soft)}
.grid{display:grid;gap:22px;grid-template-columns:1fr}
@media(min-width:820px){.grid{grid-template-columns:1fr 1fr}}
.field{margin-bottom:16px}
.field label{display:block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;margin-bottom:6px;color:var(--ink-soft)}
.field input,.field select{width:100%;padding:12px 14px;font-family:var(--font);font-size:15px;font-weight:700;color:#fff;background:rgba(255,255,255,.06);border:1px solid var(--glass-border);border-radius:14px;outline:none;transition:.15s}
.field input:focus,.field select:focus{border-color:rgba(79,157,255,.6);background:rgba(79,157,255,.08);box-shadow:0 0 0 4px rgba(79,157,255,.15)}
.result{background:linear-gradient(135deg,rgba(79,157,255,.28),rgba(34,211,238,.14));border:1px solid rgba(79,157,255,.5);border-radius:20px;padding:20px 22px;backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:0 16px 48px rgba(79,157,255,.35),inset 0 1px 0 rgba(255,255,255,.15);margin-bottom:14px}
.result .k{font-size:10px;font-weight:900;letter-spacing:.18em;text-transform:uppercase;color:#bfdbfe}
.result .v{font-size:clamp(28px,6vw,44px);font-weight:900;margin-top:6px;font-variant-numeric:tabular-nums;line-height:1;color:#fff;text-shadow:0 2px 20px rgba(0,0,0,.6)}
.chain{background:rgba(255,255,255,.06);border:1px solid var(--glass-border);border-radius:20px;padding:18px;margin-bottom:14px}
.chain .hd{font-size:10px;font-weight:900;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-dim);margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--glass-border)}
.row{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700;padding:6px 0;color:var(--ink-soft)}
.row .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:10px;box-shadow:0 0 12px currentColor}
.row .dot.ok{background:var(--lime);color:var(--lime)}
.row .dot.bad{background:var(--rose);color:var(--rose)}
.row .val{font-variant-numeric:tabular-nums;color:#fff}
.verdict{margin-top:14px;padding:12px;text-align:center;font-weight:900;font-size:13px;text-transform:uppercase;letter-spacing:.1em;border-radius:14px;border:1px solid}
.verdict.ok{background:rgba(163,230,53,.15);border-color:rgba(163,230,53,.5);color:#d9f99d}
.verdict.bad{background:rgba(251,113,133,.15);border-color:rgba(251,113,133,.5);color:#fecdd3}
.notes{background:rgba(255,255,255,.04);border:1px solid var(--glass-border);border-radius:18px;padding:16px;font-size:12.5px;color:var(--ink-soft);line-height:1.7}
.notes p::before{content:"▸ ";font-weight:900;color:var(--sky)}
#musicPanel{position:fixed;right:18px;bottom:18px;z-index:9000;display:flex;align-items:center;gap:10px;opacity:0;visibility:hidden;transform:translateY(10px);transition:.4s ease}
#musicPanel.show{opacity:1;visibility:visible;transform:none}
#volumeWrap{width:0;overflow:hidden;transition:.25s ease;opacity:0}
#musicPanel:hover #volumeWrap,#musicPanel:focus-within #volumeWrap{width:130px;opacity:1}
#volumeSlider{-webkit-appearance:none;appearance:none;width:120px;height:8px;background:rgba(255,255,255,.15);border:1px solid var(--glass-border-strong);border-radius:999px;outline:none;cursor:pointer}
#volumeSlider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:20px;height:20px;border-radius:50%;background:linear-gradient(135deg,#4f9dff,#22d3ee);border:1px solid rgba(255,255,255,.4);cursor:pointer}
#volumeSlider::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:linear-gradient(135deg,#4f9dff,#22d3ee);border:1px solid rgba(255,255,255,.4);cursor:pointer}
#musicToggle{width:58px;height:58px;border-radius:50%;background:var(--glass-strong);border:1px solid var(--glass-border-strong);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);color:#bfdbfe;font-size:22px;display:grid;place-items:center;cursor:pointer;box-shadow:0 10px 32px rgba(0,0,0,.4);font-family:var(--font);position:relative;transition:.15s}
#musicToggle:hover{transform:translateY(-2px);box-shadow:0 14px 40px rgba(79,157,255,.5)}
#musicToggle.muted{color:var(--ink-dim);opacity:.75}
#musicToggle .pulse{position:absolute;inset:-4px;border-radius:50%;border:1px solid var(--blue-glow);animation:ring 1.8s ease-out infinite;pointer-events:none}
#musicToggle.muted .pulse{display:none}
@keyframes ring{0%{transform:scale(.9);opacity:.9}100%{transform:scale(1.5);opacity:0}}
@media (max-width:480px){#musicToggle{width:50px;height:50px;font-size:18px}#musicPanel{right:12px;bottom:12px}#musicPanel:hover #volumeWrap,#musicPanel:focus-within #volumeWrap{width:90px}#volumeSlider{width:80px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{@page{margin:14mm}body{background:#fff !important;background-image:none !important;color:#000 !important;animation:none !important}.toolbar,#musicPanel,.bg-photo-desktop,.bg-photo-mobile,.bg-layer{display:none !important}.card{box-shadow:none !important;border:2px solid #000 !important;background:#fff !important;backdrop-filter:none !important}.head h1 em{background:#000 !important;color:#fff !important;box-shadow:none !important}.head h1,.head p,.field label{color:#000 !important}.result{background:#000 !important;color:#fff !important;box-shadow:none !important}.result .k{color:#ccc !important}.result .v{color:#fff !important;text-shadow:none !important}.stat,.chain,.notes{background:#fff !important;border:2px solid #000 !important;color:#000 !important}.stat .k,.stat .v,.chain .hd,.row,.notes,.notes p{color:#000 !important}.row .val{color:#000 !important}.verdict{background:#f2f2f2 !important;color:#000 !important;border:2px solid #000 !important}.field input,.field select{background:#fff !important;color:#000 !important;border:2px solid #000 !important;box-shadow:none !important}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
</head>
<body>
<div class="bg-photo-desktop"></div><div class="bg-photo-mobile"></div><div class="bg-layer"></div>
<div id="musicPanel"><div id="volumeWrap"><input type="range" id="volumeSlider" min="0" max="100" value="35"/></div>
<button id="musicToggle"><span class="pulse"></span><span id="musicIcon">🔊</span></button></div>
<iframe id="musicHost" src="music-host.html" style="position:fixed;width:1px;height:1px;left:-9999px;top:-9999px;border:0"></iframe>

<div class="wrap">
  <div class="toolbar">
    <a class="back" href="index.html" data-nav>← All calculators</a>
    <button class="pdf-btn" onclick="window.print()">🖨️ Export PDF</button>
  </div>
  <div class="card">
    <div class="head">
      <h1>Protection <em>/ OCPD</em></h1>
      <p>Breaker & fuse sizing · Ib ≤ In ≤ Iz · I²t adiabatic check</p>
    </div>
    <div class="grid">
      <div>
        <div class="field"><label>Design Current Ib (A)</label><input id="ib" type="number" value="100"/></div>
        <div class="field"><label>Cable Ampacity Iz (A)</label><input id="iz" type="number" value="130"/></div>
        <div class="field"><label>Breaker Rating In (A)</label><input id="In" type="number" value="125"/></div>
        <div class="field"><label>Fault Current (kA)</label><input id="isc" type="number" value="10"/></div>
        <div class="field"><label>Clearing Time (s)</label><input id="t" type="number" value="0.02" step="0.001"/></div>
        <div class="field"><label>k factor (Cu/PVC=115, Cu/XLPE=143)</label><input id="k" type="number" value="143"/></div>
        <div class="field"><label>Conductor Size S (mm²)</label><input id="S" type="number" value="25"/></div>
      </div>
      <div>
        <div class="result"><div class="k">Breaker Status</div><div class="v" id="status">—</div></div>
        <div class="chain">
          <div class="hd">Coordination Chain</div>
          <div class="row"><span><span class="dot ok" id="d1"></span>Ib ≤ In</span><span class="val" id="r1">—</span></div>
          <div class="row"><span><span class="dot ok" id="d2"></span>In ≤ Iz</span><span class="val" id="r2">—</span></div>
          <div class="row"><span><span class="dot ok" id="d3"></span>I²t ≤ k²S²</span><span class="val" id="r3">—</span></div>
          <div class="verdict ok" id="verdict">—</div>
        </div>
        <div class="notes" id="notes"></div>
      </div>
    </div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const K={ib:100,iz:130,In:125,isc:10,t:.02,k:143,S:25};
Object.keys(K).forEach(k=>$(k).addEventListener("input",e=>{K[k]=parseFloat(e.target.value)||0;render();}));
function render(){const o1=K.ib<=K.In,o2=K.In<=K.iz;
  const i2t=(K.isc*1000)**2*K.t;const k2s2=(K.k*K.S)**2;const o3=i2t<=k2s2;const ok=o1&&o2&&o3;
  $("r1").textContent=`${K.ib} ≤ ${K.In}`;$("r2").textContent=`${K.In} ≤ ${K.iz}`;
  $("r3").textContent=`${(i2t/1e6).toFixed(2)}M ≤ ${(k2s2/1e6).toFixed(2)}M`;
  $("d1").className="dot "+(o1?"ok":"bad");$("d2").className="dot "+(o2?"ok":"bad");$("d3").className="dot "+(o3?"ok":"bad");
  $("status").textContent=ok?"PASS":"FAIL";
  const v=$("verdict");v.textContent=ok?"✓ Fully protected":"✗ Check failed";v.className="verdict "+(ok?"ok":"bad");
  $("notes").innerHTML=`<p>I²t = (${K.isc} kA)² × ${K.t} s = ${(i2t/1e6).toFixed(2)}×10⁶ A²s</p>
    <p>k²S² = (${K.k} × ${K.S})² = ${(k2s2/1e6).toFixed(2)}×10⁶ A²s</p>
    <p>Adiabatic check per IEC 60364-4-43 / NEC 240.4.</p>`;}
render();
(function(){const toggle=document.getElementById('musicToggle'),icon=document.getElementById('musicIcon');const slider=document.getElementById('volumeSlider'),host=document.getElementById('musicHost');const saved={vol:parseInt(localStorage.getItem('zc-music-volume')||'35',10),muted:localStorage.getItem('zc-music-muted')==='1'};slider.value=saved.vol;let hostReady=false,wantPlay=false;function send(a,v){if(!host||!host.contentWindow)return;host.contentWindow.postMessage({type:'zc-music',action:a,value:v},'*');}function paint(p){icon.textContent=p?'🔊':'🔇';toggle.classList.toggle('muted',!p);}paint(!saved.muted);function requestPlay(){wantPlay=true;if(saved.muted){paint(false);return;}let n=0;const tick=()=>{send('play');if(++n<20)setTimeout(tick,100)};tick();}window.addEventListener('message',e=>{const d=e.data||{};if(d.type==='zc-music-ready'){hostReady=true;send('query');send('volume',slider.value);if(wantPlay&&!saved.muted)send('play');}if(d.type==='zc-music-state'){if(d.error){setTimeout(()=>send('play'),400);return;}paint(d.playing);if(typeof d.volume==='number')slider.value=d.volume;}});let started=false;['mousemove','touchstart','keydown','scroll','click','pointerdown'].forEach(evt=>{window.addEventListener(evt,function once(){if(started)return;started=true;if(saved.muted){paint(false);return;}requestPlay();},{once:true,passive:true});});toggle.addEventListener('click',()=>{wantPlay=!toggle.classList.contains('muted');send('toggle');});slider.addEventListener('input',function(){const v=parseInt(this.value,10);localStorage.setItem('zc-music-volume',v);send('volume',v);});setTimeout(()=>document.getElementById('musicPanel').classList.add('show'),400);})();
document.addEventListener('click',e=>{const link=e.target.closest('a[data-nav]');if(!link)return;const href=link.getAttribute('href');if(!href||href.startsWith('http')||href.startsWith('mailto')||href.startsWith('#'))return;e.preventDefault();document.body.classList.add('leaving');setTimeout(()=>{window.location.href=href},300);});
</script>
</body>
</html>
